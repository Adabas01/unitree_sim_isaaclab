# In-distribution layout of the mid-train dataset G1_Dex1_Find_Green_Blocks (490 episodes; prompt verbatim), written by
# tools/author_g1_data_specs.py (pile drawn with numpy seed [0, 5]). As recorded: a loose pile of ~30 red and yellow
# DUPLO-size bricks (2x2 and 2x4, 19 mm high), mostly one layer, with one green brick in it, a teal parts bin to the
# right; the robot moves a few bricks aside if needed and puts the green one into the bin (episodes 5-12 s).
# Here 26 bricks, mostly one layer (14, then 10 and 2 on top; the upper ones drop a few mm and settle), the
# one green 2x2 brick in the bottom layer near the middle, partly covered; success = it lies in the bin (task type
# put, as REALM's find_green_blocks). Pile region from the recorded grasps, bin from each episode's last release (15 episodes, forward
# kinematics, torso frame); brick sizes and counts from the first head frames. The real bin has a sloped front; this
# one is a plain open box.
# Run with: --table-height 0.9155 (table +0.070 m in the torso frame, from the Collect_Eggs
# grasps; see author_g1_data_specs.py) and --start-pose=-0.106,0.585,0.397,0.017,-0.416,0.059,-0.808,-0.123,-0.712,-0.201,-0.038,0.455,0.065,1.088 (median first frame of the 15 episodes).
